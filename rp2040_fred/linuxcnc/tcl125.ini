[EMC]
VERSION = 1.1
MACHINE = tcl125
DEBUG = 1

[DISPLAY]
DISPLAY = gmoccapy
LATHE = 1
BACK_TOOL_LATHE = 1
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE =     1.5
MAX_SPINDLE_OVERRIDE =  1.2
MIN_SPINDLE_OVERRIDE = .5
PROGRAM_PREFIX = /home/chris/Projects/tcl125/tcl202_dis/linuxcnc/ng_files
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 1
INCREMENTS = 1.000 mm, 0.100 mm, 0.010 mm, 0.001 mm
CYCLE_TIME = 100

[FILTER]
PROGRAM_EXTENSION = .py Python Script
py = python3

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = tcl125.var
SUBROUTINE_PATH = python
FEATURES = 12
REMAP = G33.2 modalgroup=1 argspec=Xx^Zz^k py=g332
REMAP = G76.2 modalgroup=1 argspec=PZIJKQHELR py=g762

[PYTHON]
TOPLEVEL = python/toplevel.py
PATH_PREPEND = python
LOG_LEVEL = 8

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[HAL]
HALFILE = tcl125.hal
POSTGUI_HALFILE = gmoccapy_postgui.hal

[TRAJ]
COORDINATES =      X Z
LINEAR_UNITS =     mm
ANGULAR_UNITS =    degree
DEFAULT_LINEAR_VELOCITY = 25.0
MAX_LINEAR_VELOCITY = 100.0

[KINS]
KINEMATICS = trivkins coordinates=XZ
JOINTS = 2

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = lathe.tbl
TOOL_CHANGE_POSITION = 0 0 0
RANDOM_TOOLCHANGER = 0

[AXIS_X]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 200.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 200.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 10.0
HOME_LATCH_VEL = 10.0
HOME_SEQUENCE = 0
FERROR = 200.0

[AXIS_Z]
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 200.0

[JOINT_1]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -100.0
MAX_LIMIT = 100.0
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 200.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 10.0
HOME_LATCH_VEL = 10.0
HOME_SEQUENCE = 1
FERROR = 200.0

[SPINDLE_0]
MAX_FORWARD_VELOCITY = 3750
MIN_FORWARD_VELOCITY = 50
MAX_REVERSE_VELOCITY = 3750